name: 青云系统保活

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 唤醒青云学员系统
        run: |
          echo "===== 保活开始 $(date -u '+%Y-%m-%d %H:%M:%S UTC') ====="
          URL="https://qingyun-xueji.app.workbuddy.host/?sharecode=HMEGIN445N"
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$URL")
            echo "第 $i 次: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "保活成功，系统处于热态"
              exit 0
            fi
            sleep 10
          done
          echo "三次均未成功，服务可能异常，请检查"
          exit 1
